name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter
        run: brew install swift-format
      - name: Lint
        run: ./scripts/lint.sh
      - name: Build
        run: swift build
      - name: Test
        run: ./scripts/test.sh
